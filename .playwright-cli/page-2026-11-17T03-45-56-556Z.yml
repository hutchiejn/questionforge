            - code [ref=f1e149]: .docx
            - text: file. Check its page breaks before printing.
          - heading "Save as PDF" [level=3] [ref=f1e150]
          - paragraph [ref=f1e151]:
            - text: Choose
            - strong [ref=f1e152]: Print / save as PDF
            - text: ", then select Chrome's"
            - strong [ref=f1e153]: Save as PDF
            - text: destination. For QuestionForge's margins, use Chrome's default print margins and disable Chrome's additional headers and footers to avoid duplicates.
          - paragraph [ref=f1e155]: The title and answer key remain full-width in two-column mode. Long essay responses may still be easier to read in one column.

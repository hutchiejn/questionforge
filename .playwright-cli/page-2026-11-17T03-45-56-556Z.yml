          - paragraph [ref=f1e76]: Only load unpacked extensions from sources you trust. These installation steps are for testing while a Web Store listing is not available.
        - generic [ref=f1e77]:
          - generic [ref=f1e78]: 02 / PREPARE
          - heading "Build an exam from teaching materials" [level=2] [ref=f1e79]
          - paragraph [ref=f1e80]: Use this guided workflow when you have a lesson plan, Budget of Work (BOW), Table of Specifications (TOS), or curriculum guide.
          - list [ref=f1e81]:
            - listitem [ref=f1e82]:
              - text: Open
              - strong [ref=f1e83]: 00 Prompt
              - text: and select the source type.
            - listitem [ref=f1e84]:
              - text: Choose
              - strong [ref=f1e85]: Import files
              - text: ","
              - strong [ref=f1e86]: Paste text
              - text: ", or"
              - strong [ref=f1e87]: Attach in ChatGPT
              - text: .
            - listitem [ref=f1e88]: For local import, verify the structured content against the original document. Approve only information you have checked.
            - listitem [ref=f1e89]: Confirm detected grade, subject, quarter, and school where available. Set question counts and cognitive levels.
            - listitem [ref=f1e90]:
              - text: Copy the
              - strong [ref=f1e91]: coverage planning prompt
              - text: into ChatGPT. If the content is long, copy and confirm numbered source packets in order.
            - listitem [ref=f1e92]:
              - text: Review the proposed coverage plan. Only when satisfied, check approval and copy the
              - strong [ref=f1e93]: exam generation prompt
              - text: .
            - listitem [ref=f1e94]: Request structured JSON, copy it into QuestionForge, and validate the imported questions.
          - paragraph [ref=f1e96]: QuestionForge creates prompts; ChatGPT generates the questions. QuestionForge itself has no AI API, and you decide what source text to paste into ChatGPT.
          - heading "What if extraction fails?" [level=3] [ref=f1e97]
          - paragraph [ref=f1e98]: Some PDFs are scanned, encrypted, or have complex reading order. The current extension does not include automatic OCR. When PDF extraction is uncertain, use a DOCX/XLSX source where available or paste text you have manually verified.
          - heading "Large documents" [level=3] [ref=f1e99]
          - paragraph [ref=f1e100]: QuestionForge can break reviewed content into numbered packets, but copying every packet doesn't guarantee ChatGPT will retain it all. For very large sources, select a smaller teacher-approved subset and verify the resulting coverage plan.
        - generic [ref=f1e101]:
          - generic [ref=f1e102]: 03 / REVIEW & CURATE
          - heading "Review questions before export" [level=2] [ref=f1e103]
          - paragraph [ref=f1e104]:
            - text: Go to
            - strong [ref=f1e105]: 01 Import
            - text: and paste the generated assessment or import a supported structured JSON file. The JSON format is recommended because it keeps question types and answers together.
          - list [ref=f1e106]:
            - listitem [ref=f1e107]: Parse the questions.
            - listitem [ref=f1e108]:
              - text: Open
              - strong [ref=f1e109]: 02 Review
              - text: to check the total, type distribution, and warnings.
            - listitem [ref=f1e110]: Edit wording, options, correct answers, question type, points, or order.
            - listitem [ref=f1e111]: Use the formatting-repair prompt if ChatGPT returned malformed or inconsistent JSON, then re-import and validate again.
          - generic "Three stages of QuestionForge" [ref=f1e112]:
            - figure "01 / PREPARE Prepare the prompt" [ref=f1e113]:

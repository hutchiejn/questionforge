        - generic [ref=f1e172]:
          - generic [ref=f1e173]: 06 / CONSTRAINTS
          - heading "What the extension does not do" [level=2] [ref=f1e174]
          - list [ref=f1e175]:
            - listitem [ref=f1e176]: It does not generate AI questions by itself.
            - listitem [ref=f1e177]: It does not guarantee perfect extraction from scans, complex PDFs, or mathematical layouts.
            - listitem [ref=f1e178]: It does not guarantee question correctness; users must review the assessment.
            - listitem [ref=f1e179]: It does not encrypt locally saved drafts.
            - listitem [ref=f1e180]: It cannot guarantee that external AI services retain all pasted source packets.
            - listitem [ref=f1e181]: It does not process GCash payments or confirm donations.
          - paragraph [ref=f1e182]:
            - text: Need help?
            - link "Contact support" [ref=f1e183] [cursor=pointer]:
              - /url: contact.html
            - text: with the browser version, extension version, and a description of the issue—without including private student records.

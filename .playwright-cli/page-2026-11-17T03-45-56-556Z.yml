            - strong [ref=f1e48]: production-packaged developer preview
            - text: . It is not represented here as a published Chrome Web Store extension. You can install it locally using Chrome's Load unpacked feature.
          - generic [ref=f1e49]:
            - generic [ref=f1e50]:
              - generic [ref=f1e51]:

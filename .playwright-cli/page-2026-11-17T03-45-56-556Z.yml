          - paragraph [ref=f1e129]: Generated questions and answer keys can contain mistakes. A teacher or reviewer should verify content accuracy and curriculum alignment before distribution.
        - generic [ref=f1e130]:
          - generic [ref=f1e131]: 04 / FORMATTING

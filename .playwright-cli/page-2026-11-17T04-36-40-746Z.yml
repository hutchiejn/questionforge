          - paragraph [ref=e128]: Prompt previews use chatbot-neutral wording. Some labels may differ in the installed extension.
          - paragraph [ref=e130]: Generated questions and answer keys can contain mistakes. A teacher or reviewer should verify content accuracy and curriculum alignment before distribution.
        - generic [ref=e131]:

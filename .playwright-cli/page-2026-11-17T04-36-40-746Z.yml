        - generic [ref=e173]:
          - generic [ref=e174]: 06 / CONSTRAINTS
          - heading "What the extension does not do" [level=2] [ref=e175]
          - list [ref=e176]:
            - listitem [ref=e177]: It does not generate AI questions by itself.
            - listitem [ref=e178]: It does not guarantee perfect extraction from scans, complex PDFs, or mathematical layouts.
            - listitem [ref=e179]: It does not guarantee question correctness; users must review the assessment.
            - listitem [ref=e180]: It does not encrypt locally saved drafts.
            - listitem [ref=e181]: It cannot guarantee that external AI services retain all pasted source packets.
            - listitem [ref=e182]: It does not process GCash payments or confirm donations.
          - paragraph [ref=e183]:
            - text: Need help?
            - link "Contact support" [ref=e184] [cursor=pointer]:
              - /url: contact.html
            - text: with the browser version, extension version, and a description of the issue—without including private student records.

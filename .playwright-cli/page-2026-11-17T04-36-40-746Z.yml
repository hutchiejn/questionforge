        - generic [ref=e77]:
          - generic [ref=e78]: 02 / PREPARE
          - heading "Build an exam from teaching materials" [level=2] [ref=e79]
          - paragraph [ref=e80]: Use this guided workflow when you have a lesson plan, Budget of Work (BOW), Table of Specifications (TOS), or curriculum guide. Choose an AI chatbot that can follow the prompts and return the required JSON format.
          - list [ref=e81]:
            - listitem [ref=e82]:
              - text: Open
              - strong [ref=e83]: 00 Prompt
              - text: and select the source type.
            - listitem [ref=e84]:
              - text: Choose
              - strong [ref=e85]: Import files
              - text: or
              - strong [ref=e86]: Paste text
              - text: ", or attach files directly in your chosen chatbot if it supports them. The current extension labels the attachment option"
              - strong [ref=e87]: Attach in ChatGPT
              - text: ; you can use the same prompt workflow with another chatbot.
            - listitem [ref=e88]: For local import, verify the structured content against the original document. Approve only information you have checked.
            - listitem [ref=e89]: Confirm detected grade, subject, quarter, and school where available. Set question counts and cognitive levels.
            - listitem [ref=e90]:
              - text: Copy the
              - strong [ref=e91]: coverage planning prompt
              - text: into your chosen AI chatbot. If the content is long, copy and confirm numbered source packets in order.
            - listitem [ref=e92]:
              - text: Review the proposed coverage plan. Only when satisfied, check approval and copy the
              - strong [ref=e93]: exam generation prompt
              - text: .
            - listitem [ref=e94]: Request structured JSON, copy it into QuestionForge, and validate the imported questions.
          - paragraph [ref=e96]: QuestionForge creates prompts; your chosen AI chatbot generates the questions. QuestionForge itself has no AI API, and you decide what source text to share with that service.
          - heading "What if extraction fails?" [level=3] [ref=e97]
          - paragraph [ref=e98]: Some PDFs are scanned, encrypted, or have complex reading order. The current extension does not include automatic OCR. When PDF extraction is uncertain, use a DOCX/XLSX source where available or paste text you have manually verified.
          - heading "Large documents" [level=3] [ref=e99]
          - paragraph [ref=e100]: QuestionForge can break reviewed content into numbered packets, but copying every packet doesn't guarantee your AI chatbot will retain it all. For very large sources, select a smaller teacher-approved subset and verify the resulting coverage plan.
        - generic [ref=e101]:
          - generic [ref=e102]: 03 / REVIEW & CURATE
          - heading "Review questions before export" [level=2] [ref=e103]
          - paragraph [ref=e104]:
            - text: Go to
            - strong [ref=e105]: 01 Import
            - text: and paste the generated assessment or import a supported structured JSON file. The JSON format is recommended because it keeps question types and answers together.
          - list [ref=e106]:
            - listitem [ref=e107]: Parse the questions.
            - listitem [ref=e108]:
              - text: Open
              - strong [ref=e109]: 02 Review
              - text: to check the total, type distribution, and warnings.
            - listitem [ref=e110]: Edit wording, options, correct answers, question type, points, or order.
            - listitem [ref=e111]: Use the formatting-repair prompt if your AI chatbot returned malformed or inconsistent JSON, then re-import and validate again.
          - generic "Three stages of QuestionForge" [ref=e112]:

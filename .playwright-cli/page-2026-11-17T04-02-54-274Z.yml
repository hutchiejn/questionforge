          - heading "Local-first client mechanics." [level=2] [ref=e44]
          - paragraph [ref=e45]: QuestionForge operates entirely inside your Google Chrome sandbox. No accounts, zero remote database synchronizations, and deterministic question verification.
          - generic [ref=e46]:
            - text: ♢ Zero Cloud Sync
            - generic [ref=e47]: Teaching files are read strictly in-memory within Chrome.
          - generic [ref=e48]:
            - text: ▣ Structured Parsing
            - generic [ref=e49]: Deterministic JSON prompt schemas eliminate hallucinated outputs.
          - generic [ref=e50]:
            - text: ▤ True Typesetting
            - generic [ref=e51]: Pre-formatted Word DOCX and 1-or-2 column print-ready PDFs.

        - generic [ref=e76]:
          - generic [ref=e77]: 02 / PREPARE
          - heading "Build an exam from teaching materials" [level=2] [ref=e78]
          - paragraph [ref=e79]: Use this guided workflow when you have a lesson plan, Budget of Work (BOW), Table of Specifications (TOS), or curriculum guide.
          - list [ref=e80]:
            - listitem [ref=e81]:
              - text: Open
              - strong [ref=e82]: 00 Prompt
              - text: and select the source type.
            - listitem [ref=e83]:
              - text: Choose
              - strong [ref=e84]: Import files
              - text: ","
              - strong [ref=e85]: Paste text
              - text: ", or"
              - strong [ref=e86]: Attach in ChatGPT
              - text: .
            - listitem [ref=e87]: For local import, verify the structured content against the original document. Approve only information you have checked.
            - listitem [ref=e88]: Confirm detected grade, subject, quarter, and school where available. Set question counts and cognitive levels.
            - listitem [ref=e89]:
              - text: Copy the
              - strong [ref=e90]: coverage planning prompt
              - text: into ChatGPT. If the content is long, copy and confirm numbered source packets in order.
            - listitem [ref=e91]:
              - text: Review the proposed coverage plan. Only when satisfied, check approval and copy the
              - strong [ref=e92]: exam generation prompt
              - text: .
            - listitem [ref=e93]: Request structured JSON, copy it into QuestionForge, and validate the imported questions.
          - paragraph [ref=e95]: QuestionForge creates prompts; ChatGPT generates the questions. QuestionForge itself has no AI API, and you decide what source text to paste into ChatGPT.
          - heading "What if extraction fails?" [level=3] [ref=e96]
          - paragraph [ref=e97]: Some PDFs are scanned, encrypted, or have complex reading order. The current extension does not include automatic OCR. When PDF extraction is uncertain, use a DOCX/XLSX source where available or paste text you have manually verified.
          - heading "Large documents" [level=3] [ref=e98]
          - paragraph [ref=e99]: QuestionForge can break reviewed content into numbered packets, but copying every packet doesn't guarantee ChatGPT will retain it all. For very large sources, select a smaller teacher-approved subset and verify the resulting coverage plan.
        - generic [ref=e100]:
          - generic [ref=e101]: 03 / REVIEW & CURATE
          - heading "Review questions before export" [level=2] [ref=e102]
          - paragraph [ref=e103]:
            - text: Go to
            - strong [ref=e104]: 01 Import
            - text: and paste the generated assessment or import a supported structured JSON file. The JSON format is recommended because it keeps question types and answers together.
          - list [ref=e105]:
            - listitem [ref=e106]: Parse the questions.
            - listitem [ref=e107]:
              - text: Open
              - strong [ref=e108]: 02 Review
              - text: to check the total, type distribution, and warnings.
            - listitem [ref=e109]: Edit wording, options, correct answers, question type, points, or order.
            - listitem [ref=e110]: Use the formatting-repair prompt if ChatGPT returned malformed or inconsistent JSON, then re-import and validate again.
          - generic "Three stages of QuestionForge" [ref=e111]:

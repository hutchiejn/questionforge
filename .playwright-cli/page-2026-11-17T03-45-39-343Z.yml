        - generic [ref=e171]:
          - generic [ref=e172]: 06 / CONSTRAINTS
          - heading "What the extension does not do" [level=2] [ref=e173]
          - list [ref=e174]:
            - listitem [ref=e175]: It does not generate AI questions by itself.
            - listitem [ref=e176]: It does not guarantee perfect extraction from scans, complex PDFs, or mathematical layouts.
            - listitem [ref=e177]: It does not guarantee question correctness; users must review the assessment.
            - listitem [ref=e178]: It does not encrypt locally saved drafts.
            - listitem [ref=e179]: It cannot guarantee that external AI services retain all pasted source packets.
            - listitem [ref=e180]: It does not process GCash payments or confirm donations.
          - paragraph [ref=e181]:
            - text: Need help?
            - link "Contact support" [ref=e182] [cursor=pointer]:
              - /url: contact.html
            - text: with the browser version, extension version, and a description of the issue—without including private student records.
